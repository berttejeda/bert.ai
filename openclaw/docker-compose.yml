networks:
  ai_net:
    external: true

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw/agent:latest}
    networks:
      - ai_net
    env_file: ".env"
    volumes:
      - ${PWD}/tmp:/tmp
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
        "--allow-unconfigured"
      ]

  openclaw-cli:
    profiles:
      - cli
    image: ${OPENCLAW_IMAGE:-openclaw/agent:latest}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all # Or a specific number    
    networks:
      - ai_net
    env_file: ".env"
    volumes:
      - ${PWD}/tmp:/tmp
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
